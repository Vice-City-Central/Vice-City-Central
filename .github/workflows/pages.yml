name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            404.html
            about.html
            characters.html
            fun-zone.html
            gta-5.html
            gta-6.html
            guides.html
            index.html
            news.html
            script.js
            stylee.css
            vice-city-mark.svg
            videos.html

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
